    <style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f3ee;
    color: #292a28;
    -webkit-font-smoothing: antialiased;
}

#settings {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100%;
    padding: 2rem 1.5rem;
    gap: 3.2rem;
}

#title {
    font-size: 0.9rem;
    letter-spacing: 0.34em;
    font-weight: 500;
    padding-left: 0.34em;
}

#duration-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
}

#duration-control button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.8rem;
    height: 2.8rem;
    border: 1px solid #dedbd3;
    border-radius: 50%;
    background: transparent;
    font-family: inherit;
    font-size: 1.5rem;
    font-weight: 300;
    color: #565751;
    cursor: pointer;
    padding: 0;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

#duration-control button:hover {
    background: #ebe8e0;
    border-color: #c9c5bb;
    color: #222320;
}

#duration-control button:focus-visible,
#start:focus-visible {
    outline: 2px solid #77796e;
    outline-offset: 4px;
}

#duration-display {
    min-width: 7rem;
    text-align: center;
    font-size: 2.15rem;
    line-height: 1;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: #252622;
}

#duration-display span:last-child {
    font-size: 0.9rem;
    margin-left: 0.25rem;
    color: #85857d;
    font-weight: 400;
}

#start {
    border: 1px solid #292a28;
    border-radius: 7px;
    background: #292a28;
    color: #fff;
    min-width: 8rem;
    padding: 1rem 2.8rem;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: background 160ms ease, transform 160ms ease;
}

#start:hover {
    background: #41423e;
    border-color: #41423e;
}

#start:active {
    transform: scale(0.98);
}

#session {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: black;
}

#session[hidden] {
    display: none;
}

#end-point {
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background: black;
}

@media (max-width: 480px) {
    #settings {
        gap: 2.7rem;
    }

    #duration-control {
        gap: 1.2rem;
    }
}
    </style>
</head>
<body>

   <main id="settings">
	    <div id="title">SITTING STILL</div>
	
	    <div id="duration-control">
	        <button id="decrease" aria-label="Decrease duration">−</button>
	        <div id="duration-display">
	            <span id="duration">10</span>
	            <span>min</span>
	        </div>
	        <button id="increase" aria-label="Increase duration">+</button>
	    </div>
	
	    <button id="start">START</button>
	</main>

    <main id="session" hidden>
        <div id="end-point"></div>
    </main>
    <script>
const settings = document.getElementById("settings");
const session = document.getElementById("session");
const durationDisplay = document.getElementById("duration");
const decreaseButton = document.getElementById("decrease");
const increaseButton = document.getElementById("increase");
const startButton = document.getElementById("start");
const endPoint = document.getElementById("end-point");

let duration = 10;
let wakeLock = null;
let animationFrame = null;

const colors = [
    { position: 0.00, color: [0, 0, 0] },
    { position: 0.08, color: [255, 40, 40] },
    { position: 0.20, color: [255, 160, 40] },
    { position: 0.32, color: [255, 255, 150] },
    { position: 0.44, color: [150, 255, 40] },
    { position: 0.56, color: [150, 255, 255] },
    { position: 0.68, color: [80, 120, 255] },
    { position: 0.80, color: [150, 100, 255] },
    { position: 0.92, color: [200, 180, 255] },
    { position: 0.99, color: [230, 230, 255] },
    { position: 1.00, color: [255, 255, 255] }
];

decreaseButton.addEventListener("click", () => {
    if (duration > 1) {
        duration--;
        updateDurationDisplay();
    }
});

increaseButton.addEventListener("click", () => {
    duration++;
    updateDurationDisplay();
});

startButton.addEventListener("click", startSession);
session.addEventListener("click", endSession);

function updateDurationDisplay() {
    durationDisplay.textContent = duration;
}

async function startSession() {
    if (duration <= 0) {
        return;
    }

    if (document.documentElement.requestFullscreen) {
        try {
            await document.documentElement.requestFullscreen();
        } catch (error) {
            console.log("Fullscreen unavailable:", error);
        }
    }

    settings.hidden = true;
    session.hidden = false;
    endPoint.style.display = "none";

    try {
        wakeLock = await navigator.wakeLock.request("screen");
    } catch (error) {
        console.log("Wake Lock unavailable:", error);
    }

    const startTime = performance.now();
    const durationMs = duration * 60 * 1000;

    function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / durationMs, 1);

        let start = colors[0];
        let end = colors[1];

        for (let i = 0; i < colors.length - 1; i++) {
            if (
                progress >= colors[i].position &&
                progress <= colors[i + 1].position
            ) {
                start = colors[i];
                end = colors[i + 1];
                break;
            }
        }

        const localProgress =
            (progress - start.position) /
            (end.position - start.position);

        const startColor = `rgb(${start.color[0]}, ${start.color[1]}, ${start.color[2]})`;
		const endColor = `rgb(${end.color[0]}, ${end.color[1]}, ${end.color[2]})`;
		
		const easedProgress = localProgress;
		
		session.style.backgroundColor =
		    `color-mix(in oklch, ${startColor} ${(1 - easedProgress) * 100}%, ${endColor} ${easedProgress * 100}%)`;
	
        if (progress < 1) {
            animationFrame = requestAnimationFrame(animate);
        } else {
            endPoint.style.display = "block";
        }
    }

    animationFrame = requestAnimationFrame(animate);
}

async function endSession() {
    cancelAnimationFrame(animationFrame);

    if (wakeLock) {
        try {
            await wakeLock.release();
        } catch (error) {
            console.log("Wake Lock release failed:", error);
        }

        wakeLock = null;
    }

    if (document.fullscreenElement) {
        try {
            await document.exitFullscreen();
        } catch (error) {
            console.log("Fullscreen exit failed:", error);
        }
    }

    session.hidden = true;
    settings.hidden = false;
}

    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js");
        });
      }
    </script>
