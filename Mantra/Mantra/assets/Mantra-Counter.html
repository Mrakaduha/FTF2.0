<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Mantra Counter</title>
  <style>
body {
  margin: 0;
  height: 100vh;
  background: #000;
  color: #fff;
  font-family: sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* SETUP BLOK */
#controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

/* INPUTY VEDLE SEBE */
.inputs {
  display: flex;
  gap: 12px;
}

h1 {
  font-size: 14px;
  font-weight: normal;
  opacity: 0.6;
  margin: 0;
}

input,
select {
  width: 80px;
  padding: 10px 12px;
  border-radius: 6px;
  border: none;
  font-size: 16px;
}

select {
  width: 104px;
}

/* START */
#startBtn {
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  font-size: 16px;

  background: #c49a3a;
  color: #000;
  cursor: pointer;
}

#startBtn:hover {
  opacity: 0.9;
}

/* LAST USED */
#lastUsed {
  font-size: 12px;
  opacity: 0.6;
}

#counter {
  display: none;
}

#resetBtn {
  background: transparent;
  color: #888;
  border: none;
  font-size: 14px;
  opacity: 0.5;
  cursor: pointer;
}

#resetBtn:hover {
  opacity: 0.8;
}

#run #resetBtn {
  display: block;
}

#run {
  display: none;

  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

/* podkladový kruh */
.circle-bg {
  fill: none;
  stroke: #222;
  stroke-width: 8;
}

/* progress */
#progressCircle {
  fill: none;
  stroke: #c49a3a;
  stroke-width: 8;

  stroke-dasharray: 314;
  stroke-dashoffset: 314;

  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset 1s linear;
}

#fileInput {
  display: none;
}

#fileInput.visible {
  display: block;
  width: 220px;
  color: #fff;
  font-size: 14px;
}

</style>
</head>

    <option value="custom">Own sound</option>
  </select>

  <input id="fileInput" type="file" accept="audio/*">

  <button id="startBtn">Start</button>
  <div id="counter"></div>
  <div id="lastUsed"></div>

</div>

<div id="run">

<svg width="120" height="120">
  <circle cx="60" cy="60" r="50" class="circle-bg" />
  <circle id="progressCircle" cx="60" cy="60" r="50" />
</svg>

<button id="resetBtn">Reset</button>

</div>

<audio id="mantra"></audio>

<script>
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const audio = document.getElementById("mantra");
const countInput = document.getElementById("countInput");
const pauseInput = document.getElementById("pauseInput");
const soundInput = document.getElementById("soundInput");
const fileInput = document.getElementById("fileInput");
const counter = document.getElementById("counter");
const controls = document.getElementById("controls");
const run = document.getElementById("run");

let remaining = 0;
let total = 0;
let interval = 0;
let stopped = false;
let startTime = null;
let totalDuration = 0;
let timer = null;
let customSoundUrl = null;

soundInput.addEventListener("change", () => {
  if (soundInput.value === "custom") {
    fileInput.classList.add("visible");
    return;
  }

  fileInput.classList.remove("visible");
  fileInput.value = "";

  audio.src = soundInput.value;
  audio.load();
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];

  if (!file) return;

  if (customSoundUrl) {
    URL.revokeObjectURL(customSoundUrl);
  }

  customSoundUrl = URL.createObjectURL(file);
  audio.src = customSoundUrl;
  audio.load();
});

audio.src = soundInput.value;

startBtn.addEventListener("click", async () => {
  if (soundInput.value === "custom" && !fileInput.files[0]) {
    return;
  }

  total = parseInt(countInput.value, 10);
  remaining = total;
  interval = parseFloat(pauseInput.value) * 1000;

  if (isNaN(total) || total <= 0) return;
  if (isNaN(interval) || interval < 7000) interval = 7000;

  stopped = false;
  updateCounter();

  if (!Number.isFinite(audio.duration)) {
    await new Promise(resolve => {
      audio.addEventListener("loadedmetadata", resolve, { once: true });
    });
  }

  totalDuration = total * interval;
  startTime = performance.now();

  controls.style.display = "none";
  run.style.display = "flex";
  updateLastUsed();

  playNext();
});

resetBtn.addEventListener("click", () => {
  stopped = true;
  remaining = 0;
  total = 0;

  clearTimeout(timer);
  timer = null;

  audio.pause();
  audio.currentTime = 0;

  updateCounter();
  controls.style.display = "flex";
  run.style.display = "none";
});

function playNext() {
  if (remaining <= 0 || stopped) return;

  remaining--;
  updateCounter();

  audio.currentTime = 0;
  audio.play();

  if (remaining > 0) {
    timer = setTimeout(() => {
      playNext();
    }, interval);
  }
}

function updateCounter() {
  const done = total - remaining;
  counter.textContent = `${done} / ${total}`;

  if (total > 0) {
    const progress = done / total;
    const offset = 314 - (314 * progress);
    circle.style.strokeDashoffset = offset;
  }
}

function animateProgress() {
  if (stopped) return;

  const now = performance.now();
  const elapsed = now - startTime;
  const progress = Math.min(elapsed / totalDuration, 1);

  const offset = 314 - (314 * progress);
  circle.style.strokeDashoffset = offset;

  if (progress < 1) {
    requestAnimationFrame(animateProgress);
  }
}

const circle = document.getElementById("progressCircle");

function saveCount() {
  localStorage.setItem("count", countInput.value);
}

function loadCount() {
  const saved = localStorage.getItem("count");

  if (saved !== null) {
    countInput.value = saved;
  }
}

countInput.addEventListener("change", saveCount);
window.addEventListener("DOMContentLoaded", loadCount);
loadCount();

const lastUsed = document.getElementById("lastUsed");

function updateLastUsed() {
  const count = localStorage.getItem("count");
  const date = localStorage.getItem("lastDate");

  if (count && date) {
    const d = new Date(date);
    const formatted = d.toLocaleDateString();
    lastUsed.textContent = `last: ${count} (${formatted})`;
  }
}

updateLastUsed();

</script>
