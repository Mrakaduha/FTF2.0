<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Mantra Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="controls">

  <h1>Mantra Counter</h1>

  <div class="inputs">
      <input id="countInput" type="number" value="50" min="1">
      <input id="pauseInput" type="number" value="6" min="6" step="1">
  </div>
  
   <select id="soundInput">
    <option value="sound/Yam.mp3">Yam</option>
    <option value="sound/Bowl.mp3">Bowl</option>
    <option value="custom">Own sound</option>
  </select>

  <input id="fileInput" type="file" accept="audio/*">

  <button id="startBtn">Start</button>
  <div id="counter"></div>
  <div id="lastUsed"></div>

</div>

<div id="run">

<svg width="120" height="120">
  <circle cx="60" cy="60" r="50" class="circle-bg" />
  <circle id="progressCircle" cx="60" cy="60" r="50" />
</svg>

<button id="resetBtn">Reset</button>

</div>

<audio id="mantra"></audio>

<script src="script.js"></script>
</body>
</html>
